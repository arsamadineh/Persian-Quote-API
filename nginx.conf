events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream: Bun VPS origin running the Tigh engine / Next.js app.
    upstream pq_origin {
        server app:3000;
        keepalive 32;
    }

    # Cache zone for API responses.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=pq_cache:50m inactive=60m max_size=500m;

    server {
        listen 80;
        server_name pq.arsamadineh.ir;
        location / {
            proxy_pass http://pq_origin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache GET/HEAD API and static asset responses.
            proxy_cache pq_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 301 302 1h;
            proxy_cache_valid 304 1m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Revalidation headers.
            add_header X-Cache $upstream_cache_status always;
            add_header ETag $upstream_etag always;

            # Do not cache random / personalised responses.
            if ($arg_random = "true") {
                proxy_cache_bypass 1;
                proxy_no_cache 1;
            }

            # Security headers.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # Allow conditional revalidation (304 Not Modified).
            proxy_ignore_headers Cache-Control;
        }

        location = /.well-known/pq-endpoints.json {
            proxy_pass http://pq_origin;
            proxy_cache_valid 200 24h;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
