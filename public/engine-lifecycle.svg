  <text x="600" y="428" text-anchor="middle" fill="#a8a29e" font-size="9">api</text>

  <rect x="765" y="410" width="70" height="26" rx="5" fill="#292524" stroke="#44403c" stroke-width="0.8"/>
  <text x="800" y="428" text-anchor="middle" fill="#a8a29e" font-size="9">api</text>

