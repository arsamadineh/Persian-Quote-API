<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="'Vazirmatn', system-ui, sans-serif" direction="rtl">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#78716c"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&amp;display=swap');
    </style>
  </defs>

  <rect width="1000" height="650" fill="url(#bg2)"/>

  <pattern id="g2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#292524" stroke-width="0.3" opacity="0.4"/>
  </pattern>
  <rect width="1000" height="650" fill="url(#g2)"/>

  <!-- عنوان -->
  <text x="500" y="40" text-anchor="middle" fill="#d6d3d1" font-size="22" font-weight="700">چرخه حیات درخواست</text>
  <text x="500" y="60" text-anchor="middle" fill="#78716c" font-size="11">سفر یک درخواست از ورود تا پاسخ</text>

  <!-- ═══ مرحله ۱: ورودی ═══ -->
  <rect x="40" y="85" width="140" height="44" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
  <text x="110" y="105" text-anchor="middle" fill="#d6d3d1" font-size="12" font-weight="600">۱. درخواست ورودی</text>
  <text x="110" y="120" text-anchor="middle" fill="#78716c" font-size="9">GET /api/quotes</text>

  <line x1="180" y1="107" x2="220" y2="107" stroke="#78716c" stroke-width="1.2" marker-end="url(#a2)"/>

  <!-- مرحله ۲ -->
  <rect x="225" y="85" width="130" height="44" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="290" y="105" text-anchor="middle" fill="#d6d3d1" font-size="11" font-weight="500">۲. بررسی نرخ</text>
