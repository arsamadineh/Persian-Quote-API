  <line x1="355" y1="107" x2="395" y2="107" stroke="#78716c" stroke-width="1.2" marker-end="url(#a2)"/>

  <!-- مرحله ۳ -->
  <rect x="400" y="85" width="130" height="44" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <text x="465" y="105" text-anchor="middle" fill="#d6d3d1" font-size="11" font-weight="500">۳. CORS + زمان</text>
  <text x="465" y="120" text-anchor="middle" fill="#78716c" font-size="9">هدر + Timing</text>

  <line x1="530" y1="107" x2="570" y2="107" stroke="#78716c" stroke-width="1.2" marker-end="url(#a2)"/>

