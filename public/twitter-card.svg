<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" dir="rtl">
  <defs>
    <linearGradient id="twBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="twGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="twBlur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#twBg)"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="315" r="350" fill="#f59e0b" opacity="0.035" filter="url(#twBlur)"/>
  <circle cx="1000" cy="200" r="250" fill="#b45309" opacity="0.04" filter="url(#twBlur)"/>
  <circle cx="600" cy="500" r="200" fill="#f59e0b" opacity="0.02" filter="url(#twBlur)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#twGold)" opacity="0.4"/>

  <!-- Right accent bar -->
  <rect x="1194" y="0" width="6" height="630" fill="url(#twGold)" opacity="0.4"/>

  <!-- Inner border -->
  <rect x="50" y="50" width="1100" height="530" rx="12" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.12"/>

  <!-- Decorative corner brackets -->
  <path d="M 80 80 L 80 110" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 80 80 L 110 80" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 1120 80 L 1120 110" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 1120 80 L 1090 80" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 80 550 L 80 520" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 80 550 L 110 550" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 1120 550 L 1120 520" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M 1120 550 L 1090 550" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>

  <!-- Horizontal separator above title -->
  <line x1="250" y1="175" x2="950" y2="175" stroke="url(#twGold)" stroke-width="0.8" opacity="0.2"/>

  <!-- Decorative calligraphy-style quote mark -->
  <text x="600" y="165" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="40" fill="#f59e0b" opacity="0.25">&#x275D;</text>

  <!-- Main title -->
  <text x="600" y="250" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="68" font-weight="700" fill="#fafaf9" letter-spacing="-1">
    API اشعار فارسی
  </text>

  <!-- Gold accent line under title -->
  <rect x="400" y="268" width="400" height="2.5" rx="1.25" fill="url(#twGold)" opacity="0.55"/>

  <!-- Tagline -->
  <text x="600" y="320" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="24" font-weight="400" fill="#a8a29e">
    دسترسی آزاد به گنجینه اشعار شاعران بزرگ فارسی
  </text>

  <!-- Poet names -->
  <text x="600" y="360" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="17" font-weight="300" fill="#78716c">
    مولانا &#x2022; حافظ &#x2022; سعدی &#x2022; فردوسی &#x2022; نیما &#x2022; سهراب
  </text>

  <!-- Feature badges row -->
  <g transform="translate(600, 420)" text-anchor="middle">
    <!-- Badge 1 -->
    <rect x="-350" y="-15" width="130" height="30" rx="15" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.25"/>
    <text x="-285" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="13" font-weight="500" fill="#d97706">رایگان</text>

    <!-- Badge 2 -->
    <rect x="-190" y="-15" width="130" height="30" rx="15" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.25"/>
    <text x="-125" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="13" font-weight="500" fill="#d97706">بدون کلید API</text>

    <!-- Badge 3 -->
    <rect x="-30" y="-15" width="130" height="30" rx="15" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.25"/>
    <text x="35" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="13" font-weight="500" fill="#d97706">متن‌باز</text>

    <!-- Badge 4 -->
    <rect x="130" y="-15" width="130" height="30" rx="15" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.25"/>
    <text x="195" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="13" font-weight="500" fill="#d97706">REST API</text>

    <!-- Badge 5 -->
    <rect x="290" y="-15" width="130" height="30" rx="15" fill="#f59e0b" opacity="0.08" stroke="#f59e0b" stroke-width="0.6" stroke-opacity="0.25"/>
    <text x="355" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="13" font-weight="500" fill="#d97706">MIT License</text>
  </g>

  <!-- URL at bottom -->
  <text x="600" y="510" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="15" font-weight="400" fill="#57534e" opacity="0.6">
    pq.arsamadineh.ir
  </text>

  <!-- Bottom decorative line -->
  <line x1="250" y1="540" x2="950" y2="540" stroke="url(#twGold)" stroke-width="0.8" opacity="0.15"/>
</svg>