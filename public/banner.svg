<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" dir="rtl">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Ambient glow spots -->
    <circle cx="950" cy="80" r="180" fill="#f59e0b" opacity="0.04" filter="url(#blur1)"/>
    <circle cx="250" cy="260" r="140" fill="#f59e0b" opacity="0.03" filter="url(#blur1)"/>
    <circle cx="600" cy="40" r="100" fill="#b45309" opacity="0.05" filter="url(#blur1)"/>

    <!-- Top decorative line -->
    <line x1="200" y1="58" x2="1000" y2="58" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>

    <!-- Decorative corner ornaments -->
    <!-- Top-right -->
    <path d="M 1080 40 L 1120 40 L 1120 80" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <circle cx="1120" cy="40" r="2.5" fill="#f59e0b" opacity="0.6"/>
    <!-- Top-left -->
    <path d="M 120 40 L 80 40 L 80 80" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <circle cx="80" cy="40" r="2.5" fill="#f59e0b" opacity="0.6"/>
    <!-- Bottom-right -->
    <path d="M 1080 280 L 1120 280 L 1120 240" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <circle cx="1120" cy="280" r="2.5" fill="#f59e0b" opacity="0.6"/>
    <!-- Bottom-left -->
    <path d="M 120 280 L 80 280 L 80 240" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <circle cx="80" cy="280" r="2.5" fill="#f59e0b" opacity="0.6"/>

    <!-- Center diamond ornament -->
    <path d="M 600 72 L 608 80 L 600 88 L 592 80 Z" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>

    <!-- Decorative dots pattern -->
    <circle cx="300" cy="80" r="1" fill="#f59e0b" opacity="0.2"/>
    <circle cx="400" cy="65" r="1" fill="#f59e0b" opacity="0.15"/>
    <circle cx="500" cy="72" r="1" fill="#f59e0b" opacity="0.2"/>
    <circle cx="700" cy="72" r="1" fill="#f59e0b" opacity="0.2"/>
    <circle cx="800" cy="65" r="1" fill="#f59e0b" opacity="0.15"/>
    <circle cx="900" cy="80" r="1" fill="#f59e0b" opacity="0.2"/>

    <!-- Main title -->
    <text x="600" y="155" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="52" font-weight="700" fill="#fafaf9" letter-spacing="-1">
      API اشعار فارسی
    </text>

    <!-- Gold underline accent -->
    <rect x="440" y="172" width="320" height="2" rx="1" fill="url(#gold)" opacity="0.7"/>

    <!-- Tagline -->
    <text x="600" y="210" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="18" font-weight="400" fill="#a8a29e">
      دسترسی آزاد به گنجینه اشعار شاعران بزرگ فارسی
    </text>

    <!-- Feature pills -->
    <g transform="translate(600, 248)" text-anchor="middle">
      <!-- Pill 1 -->
      <rect x="-310" y="-14" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="-250" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="12" font-weight="500" fill="#f59e0b">رایگان</text>

      <!-- Pill 2 -->
      <rect x="-170" y="-14" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="-110" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="12" font-weight="500" fill="#f59e0b">بدون احراز هویت</text>

      <!-- Pill 3 -->
      <rect x="-30" y="-14" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="30" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="12" font-weight="500" fill="#f59e0b">متن‌باز</text>

      <!-- Pill 4 -->
      <rect x="110" y="-14" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="170" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="12" font-weight="500" fill="#f59e0b">REST API</text>

      <!-- Pill 5 -->
      <rect x="250" y="-14" width="120" height="28" rx="14" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="310" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="12" font-weight="500" fill="#f59e0b">MIT License</text>
    </g>

    <!-- Bottom decorative line -->
    <line x1="200" y1="290" x2="1000" y2="290" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>
  </g>
</svg>