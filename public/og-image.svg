<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" dir="rtl">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="40%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="ogGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="ogBlur1">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="ogBlur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient glow -->
  <circle cx="900" cy="200" r="300" fill="#f59e0b" opacity="0.04" filter="url(#ogBlur1)"/>
  <circle cx="300" cy="500" r="250" fill="#f59e0b" opacity="0.03" filter="url(#ogBlur1)"/>
  <circle cx="600" cy="100" r="200" fill="#b45309" opacity="0.04" filter="url(#ogBlur1)"/>
  <ellipse cx="600" cy="315" rx="500" ry="200" fill="#f59e0b" opacity="0.02" filter="url(#ogBlur1)"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>

  <!-- Corner ornaments -->
  <!-- Top-right -->
  <path d="M 1080 60 L 1140 60 L 1140 120" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.35"/>
  <circle cx="1140" cy="60" r="3" fill="#f59e0b" opacity="0.5"/>
  <!-- Top-left -->
  <path d="M 120 60 L 60 60 L 60 120" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.35"/>
  <circle cx="60" cy="60" r="3" fill="#f59e0b" opacity="0.5"/>
  <!-- Bottom-right -->
  <path d="M 1080 570 L 1140 570 L 1140 510" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.35"/>
  <circle cx="1140" cy="570" r="3" fill="#f59e0b" opacity="0.5"/>
  <!-- Bottom-left -->
  <path d="M 120 570 L 60 570 L 60 510" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.35"/>
  <circle cx="60" cy="570" r="3" fill="#f59e0b" opacity="0.5"/>

  <!-- Decorative top line -->
  <line x1="300" y1="130" x2="900" y2="130" stroke="url(#ogGold)" stroke-width="1" opacity="0.25"/>

  <!-- Center diamond ornament -->
  <path d="M 600 120 L 612 132 L 600 144 L 588 132 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.45"/>

  <!-- Decorative dots -->
  <circle cx="350" cy="132" r="1.5" fill="#f59e0b" opacity="0.2"/>
  <circle cx="450" cy="126" r="1.5" fill="#f59e0b" opacity="0.15"/>
  <circle cx="520" cy="130" r="1.5" fill="#f59e0b" opacity="0.2"/>
  <circle cx="680" cy="130" r="1.5" fill="#f59e0b" opacity="0.2"/>
  <circle cx="750" cy="126" r="1.5" fill="#f59e0b" opacity="0.15"/>
  <circle cx="850" cy="132" r="1.5" fill="#f59e0b" opacity="0.2"/>

  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="72" font-weight="700" fill="#fafaf9" letter-spacing="-1">
    API اشعار فارسی
  </text>

  <!-- Gold underline -->
  <rect x="380" y="260" width="440" height="3" rx="1.5" fill="url(#ogGold)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="315" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="26" font-weight="400" fill="#a8a29e">
    دسترسی آزاد به گنجینه اشعار شاعران بزرگ فارسی
  </text>

  <!-- Sub tagline -->
  <text x="600" y="355" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="18" font-weight="300" fill="#78716c">
    مولانا، حافظ، سعدی، فردوسی، نیما، سهراب و سخنان بزرگان
  </text>

  <!-- Feature pills -->
  <g transform="translate(600, 410)" text-anchor="middle">
    <rect x="-380" y="-16" width="140" height="32" rx="16" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.3"/>
    <text x="-310" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="14" font-weight="500" fill="#f59e0b">رایگان و متن‌باز</text>

    <rect x="-210" y="-16" width="140" height="32" rx="16" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.3"/>
    <text x="-140" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="14" font-weight="500" fill="#f59e0b">بدون احراز هویت</text>

    <rect x="-40" y="-16" width="140" height="32" rx="16" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.3"/>
    <text x="30" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="14" font-weight="500" fill="#f59e0b">REST API</text>

    <rect x="130" y="-16" width="140" height="32" rx="16" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.3"/>
    <text x="200" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="14" font-weight="500" fill="#f59e0b">ویجت قابل تعبیه</text>

    <rect x="300" y="-16" width="140" height="32" rx="16" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.3"/>
    <text x="370" y="5" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="14" font-weight="500" fill="#f59e0b">MIT License</text>
  </g>

  <!-- URL -->
  <text x="600" y="490" text-anchor="middle" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="16" font-weight="400" fill="#78716c" opacity="0.7">
    pq.arsamadineh.ir
  </text>

  <!-- Bottom decorative line -->
  <line x1="300" y1="520" x2="900" y2="520" stroke="url(#ogGold)" stroke-width="1" opacity="0.2"/>
</svg>